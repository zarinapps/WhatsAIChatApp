name: ovowpp
description: "Complete Cross Platform WhatsApp CRM and Marketing Tool | Web and Mobile App | SaaS"
publish_to: "none"
version: 2.0.3+5

environment:
  sdk: ">=3.10.0 <4.0.0"

dependencies:

  cached_network_image: ^3.4.1
  connectivity_plus: ^7.3.0
  cupertino_icons: ^1.0.9
  dio: ^5.10.0
  dotted_border: ^3.1.0
  equatable: ^2.1.0
  file_picker: ^11.0.2
  firebase_core: ^4.12.1
  firebase_messaging: ^16.4.3
  flutter:
    sdk: flutter
  flutter_inappwebview: ^6.1.5
  flutter_local_notifications: ^22.1.0
  flutter_screenutil: ^5.9.3
  flutter_spinkit: ^5.2.2
  flutter_svg: ^2.3.0
  flutter_secure_storage: ^10.3.1
  flutter_widget_from_html: ^0.17.2
  get: ^4.7.3
  google_sign_in: ^7.2.0
  http: 1.6.0
  image_gallery_saver_plus: ^5.1.1
  image_picker: ^1.2.3
  intl: ^0.20.3
  just_audio: ^0.10.6
  json_annotation: ^4.12.0
  logger: ^2.7.0
  lottie:
  multi_dropdown: ^3.2.1
  open_file:
  path_provider: ^2.1.6
  permission_handler: ^12.0.3
  pin_code_fields: ^9.4.0
  shared_preferences: ^2.5.5
  shimmer: ^3.0.0
  phone_numbers_parser: ^9.0.24
  show_up_animation: ^2.1.2
  toastification: ^3.2.0
  url_launcher: ^6.3.2
  uuid: 4.6.0
  webview_flutter: 4.14.1
  fast_contacts:
  flutter_pdfview: ^1.4.4
  device_info_plus: ^12.4.0
  video_player:
  pusher_channels_flutter: ^2.6.0
  record:
  expandable_page_view: ^1.3.0

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/images/bottom_nav_bar/
    - assets/images/splash_screen/
    - assets/images/dashboard/
    - assets/icons/
    - assets/logo/
    - assets/images/onboard/
    - assets/images/logo/
    - assets/images/social/
    - assets/images/menu/
    - assets/animation/
    - assets/fonts/

  fonts:
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito/Nunito-Regular.ttf
        - asset: assets/fonts/Nunito/Nunito-Bold.ttf
          weight: 700
        - asset: assets/fonts/Nunito/Nunito-Italic.ttf
          style: italic
        - asset: assets/fonts/Nunito/Nunito-Light.ttf
          weight: 300

    - family: Archivo
      fonts:
        - asset: assets/fonts/Archivo/Archivo-Regular.ttf




